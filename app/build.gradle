plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.f0rn1.assibridge'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.f0rn1.assibridge'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ASSI_KEYSTORE') ?: 'C:/Users/Forni/tools/apk-build/android.keystore')
            storePassword System.getenv('ASSI_STORE_PASS')
            keyAlias 'android'
            keyPassword System.getenv('ASSI_KEY_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
